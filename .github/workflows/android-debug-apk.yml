name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'logo.png'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp logo.png android/app/src/main/res/drawable/sc_latam_icon.png

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sc-latam-community-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
